<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Attendance Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .admin-box { background: white; padding: 30px; border-radius: 10px; max-width: 800px; margin: 40px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .dashboard-content { display: none; text-align: left; margin-top: 30px; }
        .week-nav { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; justify-content: center; }
        .week-btn { background-color: #6c757d; padding: 8px 12px; font-size: 14px; width: auto; }
        .week-btn.active { background-color: #28a745; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        .pass-change-box { background: #eee; padding: 15px; border-radius: 5px; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>Admin Management Panel</h2>
        <p>Mercy Seat Royal Schools Attendance Records</p>

        <div id="loginGate">
            <input type="password" id="adminPassword" placeholder="Enter Admin Password" required>
            <button onclick="verifyAdminAccess()">Access Dashboard</button>
            <p id="loginError" style="color: red; font-weight: bold; margin-top: 10px;"></p>
        </div>

        <div id="dashboard" class="dashboard-content">
            <h3>Attendance Sheet Registry</h3>
            
            <div class="week-nav" id="weekNavigation"></div>

            <h4 id="currentWeekTitle">Viewing: Week 1 Data</h4>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Teacher Name</th>
                            <th>Section</th>
                            <th>Day</th>
                            <th>Time Logged</th>
                            <th>GPS Coordinates</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; color: #666;">Select a week or submit logs to view records.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pass-change-box">
                <h4>Change Access Password</h4>
                <input type="password" id="oldPass" placeholder="Enter Current Password">
                <input type="password" id="newPass" placeholder="Enter New Password">
                <button onclick="updateSystemPassword()" style="background-color: #28a745;">Update Secret Key</button>
                <p id="passUpdateStatus" style="font-weight: bold; margin-top: 5px;"></p>
            </div>
        </div>
    </div>

    <script>
        // Replace this with your initial password string
        let currentSystemPassword = "MercySeatAdmin123"; 

        // Set up 14 Quick Week selection buttons dynamically
        const nav = document.getElementById('weekNavigation');
        for (let w = 1; w <= 14; w++) {
            nav.innerHTML += `<button class="week-btn ${w===1?'active':''}" onclick="loadWeekRecords(${w}, this)">W${w}</button>`;
        }

        function verifyAdminAccess() {
            const entered = document.getElementById('adminPassword').value;
            if (entered === currentSystemPassword) {
                document.getElementById('loginGate').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                // Here, we would trigger a background fetch code from Google Sheets API later!
            } else {
                document.getElementById('loginError').innerText = "Incorrect Password. Access Denied.";
            }
        }

        function loadWeekRecords(weekNum, element) {
            document.querySelectorAll('.week-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('currentWeekTitle').innerText = `Viewing: Week ${weekNum} Data`;
            
            // This pulls the filtered spreadsheet data for that specific week
            console.log("Requesting Google Sheet layout tab data for Week: " + weekNum);
        }

        function updateSystemPassword() {
            const oldP = document.getElementById('oldPass').value;
            const newP = document.getElementById('newPass').value;
            const status = document.getElementById('passUpdateStatus');

            if (oldP !== currentSystemPassword) {
                status.innerText = "❌ Former password is incorrect!";
                status.style.color = "red";
            } else if (newP.trim() === "") {
                status.innerText = "❌ New password cannot be empty!";
                status.style.color = "red";
            } else {
                currentSystemPassword = newP;
                status.innerText = "✨ Password updated successfully!";
                status.style.color = "green";
                document.getElementById('oldPass').value = "";
                document.getElementById('newPass').value = "";
            }
        }
    </script>
</body>
</html>
