<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Attendance Portal</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin-top: 15px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .debug-box {
            margin-top: 15px;
            font-size: 13px;
            color: #666;
            background: #eee;
            padding: 10px;
            border-radius: 5px;
            display: none;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mercy Seat Royal Schools</h2>
        <p>Teacher Attendance Portal</p>
        
        <button onclick="checkLocationAndLogin()">Log In / Mark Attendance</button>
        
        <div id="debugCoords" class="debug-box"></div>
    </div>

    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker failed: ', err));
            });
        }

        // Updated Configuration with Primary and Secondary locations
        // Both profiles feature a 350-meter (~10 blocks) buffer zone for flexible check-ins
        const LOCATIONS = {
            PRIMARY: { 
                lat: 6.845301, 
                lon: 3.209212, 
                radius: 350 
            },
            SECONDARY: { 
                lat: 6.4474,  // Set directly to your verified secondary campus latitude
                lon: 3.3903,  // Set directly to your verified secondary campus longitude
                radius: 350 
            }
        };

        // Distance Calculation Formula (Haversine)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth's radius in meters
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c; 
        }

        function checkLocationAndLogin() {
            if (!navigator.geolocation) {
                alert("Your device or browser does not support location tracking.");
                return;
            }

            const gpsOptions = {
                enableHighAccuracy: true,
                timeout: 15000, 
                maximumAge: 0
            };

            alert("Verifying your location. Please hold on...");

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const teacherLat = position.coords.latitude;
                    const teacherLon = position.coords.longitude;

                    // Calculate real-time distance to both campuses
                    const distanceToPrimary = calculateDistance(teacherLat, teacherLon, LOCATIONS.PRIMARY.lat, LOCATIONS.PRIMARY.lon);
                    const distanceToSecondary = calculateDistance(teacherLat, teacherLon, LOCATIONS.SECONDARY.lat, LOCATIONS.SECONDARY.lon);

                    // Allow entry if within the 10-block buffer of EITHER school section
                    if (distanceToPrimary <= LOCATIONS.PRIMARY.radius || distanceToSecondary <= LOCATIONS.SECONDARY.radius) {
                        alert("Location Verified! Welcome to Mercy Seat Royal Schools.");
                        document.getElementById('debugCoords').style.display = "none";
                        proceedWithAttendance(); 
                    } else {
                        alert("Access Denied: You are not within the school premises or its immediate 10-block vicinity.");
                        
                        // Keeps the debug window active just in case verification fluctuates
                        const debugBox = document.getElementById('debugCoords');
                        debugBox.style.display = "block";
                        debugBox.innerHTML = `<strong>Your Current Coordinates:</strong><br>lat: ${teacherLat}<br>lon: ${teacherLon}`;
                    }
                },
                (error) => {
                    if (error.code === error.PERMISSION_DENIED) {
                        alert("Access Denied: You must ALLOW location access to sign into the attendance portal.");
                    } else {
                        alert("Error detecting location. Please ensure your device GPS is turned on and try again.");
                    }
                },
                gpsOptions
            );
        }

        function proceedWithAttendance() {
            console.log("Teacher verified within acceptable bounds.");
            // Your ledger or storage redirect actions go here
        }
    </script>
</body>
</html>
