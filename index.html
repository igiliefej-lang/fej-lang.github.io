<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Attendance Portal</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mercy Seat Royal College</h2>
        <p>Teacher Attendance Portal</p>
        <button onclick="checkLocationAndLogin()">Log In / Mark Attendance</button>
    </div>

    <script>
        // 1. Service Worker Registration (Linked to your sw.js)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed: ', err));
            });
        }

        // 2. Your School Coordinates Configuration
        const SCHOOL_CONFIG = {
            lat: 6.845301, 
            lon: 3.209212, 
            radiusMeters: 70 // 70-meter buffer zone around the school gates
        };

        // 3. Mathematical formula to calculate distance in meters
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth's radius in meters
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c; 
        }

        // 4. Geofencing Security Check Function
        function checkLocationAndLogin() {
            if (!navigator.geolocation) {
                alert("Your device or browser does not support location tracking.");
                return;
            }

            // Forces high precision GPS tracking
            const gpsOptions = {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            };

            alert("Verifying your location. Please hold on...");

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const teacherLat = position.coords.latitude;
                    const teacherLon = position.coords.longitude;

                    // Calculate the distance from Mercy Seat Royal College
                    const distance = calculateDistance(
                        teacherLat, 
                        teacherLon, 
                        SCHOOL_CONFIG.lat, 
                        SCHOOL_CONFIG.lon
                    );

                    // Check if they are within the boundary
                    if (distance <= SCHOOL_CONFIG.radiusMeters) {
                        alert("Location Verified! Welcome to school.");
                        proceedWithAttendance(); 
                    } else {
                        // Blocked: Too far away
                        alert("Access Denied: You are not within the school premises. You cannot mark attendance from home or the road.");
                    }
                },
                (error) => {
                    // Blocked: User clicked "Deny" or GPS is turned off
                    if (error.code === error.PERMISSION_DENIED) {
                        alert("Access Denied: You must ALLOW location access to sign into the attendance portal.");
                    } else {
                        alert("Error detecting location. Please ensure your device GPS is turned on and try again.");
                    }
                },
                gpsOptions
            );
        }

        // 5. This handles what happens after a successful location match
        function proceedWithAttendance() {
            console.log("Teacher verified on-site. Proceeding...");
            // TODO: Add your redirection logic here (e.g., window.location.href = "dashboard.html";)
        }
    </script>
</body>
</html>
