<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Attendance Portal</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
            padding: 15px;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        .header-frame {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 10px;
        }
        .header-text {
            flex-grow: 1;
        }
        .logo-left {
            width: 65px;
            height: auto;
            object-fit: contain;
        }
        .logo-right-container {
            width: 65px;
            height: 65px;
            overflow: hidden;
            border-radius: 50%;
            border: 2px solid #007bff;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
        }
        .logo-right-container img {
            width: 100%;
            height: 135%;
            object-fit: cover;
            object-position: center 58%;
        }
        h2 {
            color: #333;
            margin: 0 0 5px 0;
            font-size: 18px;
        }
        p.subtitle {
            color: #666;
            margin: 0;
            font-size: 13px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-frame">
            <img src="logo.png" alt="Logo Left" class="logo-left" onerror="this.src='logo.jpg'; this.onerror=null;">
            <div class="header-text">
                <h2>Mercy Seat Royal Schools</h2>
                <p class="subtitle">Teacher Attendance Portal</p>
            </div>
            <div class="logo-right-container">
                <img src="left.png" alt="Logo Right" onerror="this.src='left.jpg'; this.onerror=null;">
            </div>
        </div>
        
        <button onclick="checkLocationAndLogin()">Log In / Mark Attendance</button>
        
        <div id="statusUpdate" class="status-msg"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }

        const LOCATIONS = {
            PRIMARY: { lat: 6.845301, lon: 3.209212, radius: 350 },
            SECONDARY: { lat: 6.4474, lon: 3.3903, radius: 350 }
        };

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))); 
        }

        function checkLocationAndLogin() {
            if (!navigator.geolocation) {
                document.getElementById('statusUpdate').innerText = "Location tracking not supported.";
                return;
            }

            document.getElementById('statusUpdate').innerText = "Verifying location...";
            document.getElementById('statusUpdate').style.color = "#333";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const teacherLat = position.coords.latitude;
                    const teacherLon = position.coords.longitude;

                    const distanceToPrimary = calculateDistance(teacherLat, teacherLon, LOCATIONS.PRIMARY.lat, LOCATIONS.PRIMARY.lon);
                    const distanceToSecondary = calculateDistance(teacherLat, teacherLon, LOCATIONS.SECONDARY.lat, LOCATIONS.SECONDARY.lon);

                    if (distanceToPrimary <= LOCATIONS.PRIMARY.radius || distanceToSecondary <= LOCATIONS.SECONDARY.radius) {
                        // Instant background redirect with NO OK boxes!
                        window.location.href = "ledger.html";
                    } else {
                        document.getElementById('statusUpdate').innerText = "Access Denied: Not within school vicinity.";
                        document.getElementById('statusUpdate').style.color = "red";
                    }
                },
                (error) => {
                    document.getElementById('statusUpdate').style.color = "red";
                    document.getElementById('statusUpdate').innerText = "GPS Error. Ensure location access is allowed.";
                },
                { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
