<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Sign-In Sheet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .ledger-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        .header-frame {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }
        .header-text {
            text-align: center;
            flex-grow: 1;
        }
        .logo-left {
            max-width: 75px;
            height: auto;
            object-fit: contain;
        }
        .logo-right-container {
            width: 70px;
            height: 70px;
            overflow: hidden;
            border-radius: 50%;
            border: 2px solid #007bff;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        .logo-right-container img {
            width: 100%;
            height: 135%;
            object-fit: cover;
            object-position: center 58%;
            filter: contrast(1.05) brightness(1.02);
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button.submit-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button.submit-btn:hover {
            background-color: #218838;
        }
        .success-banner {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
            text-align: left;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="ledger-container">
        
        <div class="header-frame">
            <img src="logo_left.png.png" alt="School Logo Left" class="logo-left" onerror="this.src='logo.jpg'; this.onerror=null;">
            <div class="header-text">
                <h2>Mercy Seat Royal Schools</h2>
                <p class="subtitle">Official Staff Attendance Registry</p>
            </div>
            <div class="logo-right-container">
                <img src="logo_right.jpg.jpg" alt="School Logo Right" onerror="this.src='left.jpg'; this.onerror=null;">
            </div>
        </div>

        <form id="attendanceForm" onsubmit="getCoordinatesAndSave(event)">
            <div class="form-group">
                <label for="teacherName">Full Name:</label>
                <input type="text" id="teacherName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="section">School Section:</label>
                <select id="section" required>
                    <option value="">-- Select Your Section --</option>
                    <option value="Primary">Primary School</option>
                    <option value="Secondary">Secondary School</option>
                </select>
            </div>

            <button type="submit" class="submit-btn">Submit Attendance</button>
        </form>

        <div id="successMessage" class="success-banner">
            <h3>✓ Attendance Logged Successfully!</h3>
            <div id="logDetails"></div>
        </div>
    </div>

    <script>
        function getCoordinatesAndSave(event) {
            event.preventDefault(); 
            
            const name = document.getElementById('teacherName').value;
            const section = document.getElementById('section').value;
            const formattedTimestamp = new Date().toLocaleString();

            // Try to fetch the user's coordinates right at the exact moment of submission
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        displayLogRecord(name, section, formattedTimestamp, `${lat}, ${lon}`);
                    },
                    (error) => {
                        // If GPS is blocked or off, save the submission but note that location was unavailable
                        displayLogRecord(name, section, formattedTimestamp, "Location Access Denied by User/Device");
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                displayLogRecord(name, section, formattedTimestamp, "Geolocation Not Supported");
            }
        }

        function displayLogRecord(name, section, time, locationData) {
            const attendanceLog = {
                teacher: name,
                campusSection: section,
                time: time,
                coordinates: locationData
            };

            // This prints the record with coordinates directly to your browser's developer console
            console.log("Saving secured log record:", attendanceLog);

            // Hide form and display details on screen
            document.getElementById('attendanceForm').style.display = 'none';
            
            const logDetails = document.getElementById('logDetails');
            logDetails.innerHTML = `
                <p><strong>Name:</strong> ${name}</p>
                <p><strong>Section:</strong> ${section}</p>
                <p><strong>Verified Phone Time:</strong> ${time}</p>
                <p><strong>Logged From Coordinates:</strong> <span style="color: #0056b3; font-family: monospace;">${locationData}</span></p>
                <p style="color: #666; font-style: italic; font-size: 13px; margin-top: 15px;">Have a wonderful day at school!</p>
            `;
            
            document.getElementById('successMessage').style.display = 'block';
        }
    </script>
</body>
</html>
