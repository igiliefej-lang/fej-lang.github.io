<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Attendance Portal</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        /* Framed Header Layout matching ledger styling */
        .header-frame {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }
        .header-text {
            flex-grow: 1;
        }
        .logo-left {
            max-width: 75px;
            height: auto;
            object-fit: contain;
        }
        /* Digital badge styling for the second logo */
        .logo-right-container {
            width: 70px;
            height: 70px;
            overflow: hidden;
            border-radius: 50%;
            border: 2px solid #007bff;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        .logo-right-container img {
            width: 100%;
            height: 135%;
            object-fit: cover;
            object-position: center 58%;
            filter: contrast(1.05) brightness(1.02);
        }
        h2 {
            color: #333;
            margin: 0 0 5px 0;
            font-size: 20px;
        }
        p.subtitle {
            color: #666;
            margin: 0;
            font-size: 14px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 15px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-frame">
            <img src="logo_left.png.png" alt="School Logo Left" class="logo-left" onerror="this.src='logo.jpg'; this.onerror=null;">
            
            <div class="header-text">
                <h2>Mercy Seat Royal Schools</h2>
                <p class="subtitle">Teacher Attendance Portal</p>
            </div>
            
            <div class="logo-right-container">
                <img src="logo_right.jpg.jpg" alt="School Logo Right" onerror="this.src='left.jpg'; this.onerror=null;">
            </div>
        </div>
        
        <button onclick="checkLocationAndLogin()">Log In / Mark Attendance</button>
        
        <div id="statusUpdate" class="status-msg"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!'))
                    .catch(err => console.log('Service Worker failed: ', err));
            });
        }

        const LOCATIONS = {
            PRIMARY: { lat: 6.845301, lon: 3.209212, radius: 350 },
            SECONDARY: { lat: 6.4474, lon: 3.3903, radius: 350 }
        };

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c; 
        }

        function checkLocationAndLogin() {
            if (!navigator.geolocation) {
                document.getElementById('statusUpdate').innerText = "Location tracking not supported.";
                document.getElementById('statusUpdate').style.color = "red";
                return;
            }

            const gpsOptions = {
                enableHighAccuracy: true,
                timeout: 6000, 
                maximumAge: 0
            };

            document.getElementById('statusUpdate').innerText = "Verifying location...";
            document.getElementById('statusUpdate').style.color = "#333";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const teacherLat = position.coords.latitude;
                    const teacherLon = position.coords.longitude;

                    const distanceToPrimary = calculateDistance(teacherLat, teacherLon, LOCATIONS.PRIMARY.lat, LOCATIONS.PRIMARY.lon);
                    const distanceToSecondary = calculateDistance(teacherLat, teacherLon, LOCATIONS.SECONDARY.lat, LOCATIONS.SECONDARY.lon);

                    if (distanceToPrimary <= LOCATIONS.PRIMARY.radius || distanceToSecondary <= LOCATIONS.SECONDARY.radius) {
                        // High speed automatic transition without alerts
                        window.location.href = "ledger.html";
                    } else {
                        document.getElementById('statusUpdate').innerText = "Access Denied: Not within vicinity.";
                        document.getElementById('statusUpdate').style.color = "red";
                    }
                },
                (error) => {
                    document.getElementById('statusUpdate').style.color = "red";
                    if (error.code === error.PERMISSION_DENIED) {
                        document.getElementById('statusUpdate').innerText = "Permission Denied. Please allow location access.";
                    } else {
                        document.getElementById('statusUpdate').innerText = "GPS Error. Please try again.";
                    }
                },
                gpsOptions
            );
        }
    </script>
</body>
</html>
